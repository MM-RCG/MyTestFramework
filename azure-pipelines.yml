# UI 自动化测试 Pipeline (调试版本)
trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
# 安装 .NET 8.0
- task: UseDotNet@2
  displayName: '安装 .NET 8.0'
  inputs:
    version: '8.x'

# 还原依赖包
- script: dotnet restore
  displayName: '还原 NuGet 包'

# 构建项目
- script: dotnet build --configuration Release --no-restore
  displayName: '构建项目'

# 列出所有测试（调试用）
- script: dotnet test --list-tests
  displayName: '列出所有测试用例'

# 安装 Playwright 浏览器
- script: |
    dotnet build --configuration Release
    if (Test-Path ".\bin\Release\net8.0\playwright.ps1") {
        powershell .\bin\Release\net8.0\playwright.ps1 install chromium
    } else {
        Write-Host "playwright.ps1 未找到，请检查构建路径"
    }
  displayName: '安装 Playwright 浏览器'

# 运行登录测试（先跑一个简单的）
- script: dotnet test --no-build --configuration Release --filter "LoginTest" --logger "console;verbosity=detailed"
  displayName: '运行登录测试（调试）'
  continueOnError: true

# 运行所有测试
- script: dotnet test --no-build --configuration Release --logger "trx" --results-directory $(Build.ArtifactStagingDirectory)/TestResults
  displayName: '运行所有 UI 测试'
  continueOnError: true

# 发布测试结果
- task: PublishTestResults@2
  displayName: '发布测试结果'
  condition: always()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: false