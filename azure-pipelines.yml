# UI 自动化测试 Pipeline
trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
# 安装 .NET 8.0
- task: UseDotNet@2
  displayName: '安装 .NET 8.0'
  inputs:
    version: '8.x'

# 还原依赖包
- script: dotnet restore
  displayName: '还原 NuGet 包'

# 构建项目
- script: dotnet build --no-restore --configuration Release
  displayName: '构建项目'

# 安装 Playwright 浏览器
- script: |
    dotnet build
    pwsh .\bin\Release\net8.0\playwright.ps1 install
  displayName: '安装 Playwright 浏览器'

# 运行测试
- script: dotnet test --no-build --configuration Release --logger "trx" --results-directory $(Build.ArtifactStagingDirectory)/TestResults
  displayName: '运行 UI 自动化测试'

# 发布测试结果
- task: PublishTestResults@2
  displayName: '发布测试结果到流水线'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true

# 保存测试报告（可选）
- task: PublishBuildArtifacts@1
  displayName: '保存测试报告'
  condition: succeededOrFailed()
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)/TestResults
    artifactName: 'TestResults'