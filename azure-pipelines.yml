# UI 自动化测试 Pipeline (调试版本)
trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
# 安装 .NET 8.0
- task: UseDotNet@2
  displayName: '安装 .NET 8.0'
  inputs:
    version: '8.x'

# 还原依赖包
- script: dotnet restore
  displayName: '还原 NuGet 包'

# 构建项目
- script: dotnet build --configuration Release --no-restore
  displayName: '构建项目'

# 安装 Playwright 浏览器（推荐方式）
- powershell: |
    # 安装 Playwright CLI 工具
    dotnet tool install --global Microsoft.Playwright.CLI
    
    # 安装浏览器
    playwright install chromium
    
    # 或者一行命令完成
    # dotnet msbuild .\YourTestProject.csproj /t:PlaywrightInstall
  displayName: '安装 Playwright 浏览器'

- script: |
    echo 10.160.140.102 vpc-sz-interroll >> %SystemRoot%\System32\drivers\etc\hosts
  displayName: 'Configure hosts file for internal domain'

# 运行登录测试
- script: dotnet test --configuration Release --filter "LoginTest" --logger "console;verbosity=detailed"
  displayName: '运行登录测试（调试）'
  continueOnError: true

# 运行所有测试
- script: dotnet test --configuration Release --logger "trx" --results-directory $(Build.ArtifactStagingDirectory)/TestResults
  displayName: '运行所有 UI 测试'
  continueOnError: true

# 发布测试结果
- task: PublishTestResults@2
  displayName: '发布测试结果'
  condition: always()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: false