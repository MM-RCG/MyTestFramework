# UI 自动化测试 Pipeline (调试版本)
trigger:
- main

pool:
  name: 'CRR' 

steps:
# 安装 .NET 8.0
- task: UseDotNet@2
  displayName: '安装 .NET 8.0'
  inputs:
    version: '8.x'

# 还原依赖包
- script: dotnet restore
  displayName: '还原 NuGet 包'

# 构建项目
- script: dotnet build --configuration Release --no-restore
  displayName: '构建项目'

# 安装 Playwright 浏览器（强制安装并设置路径）
- powershell: |
    # 设置 Playwright 浏览器安装路径
    $env:PLAYWRIGHT_BROWSERS_PATH = "$env:USERPROFILE\ms-playwright"
    
    # 安装 Playwright CLI 工具
    dotnet tool update --global Microsoft.Playwright.CLI
    
    # 强制安装所有浏览器
    playwright install chromium
    
    # 验证安装
    if (Test-Path "$env:USERPROFILE\ms-playwright\chromium-*\chrome-win\chrome.exe") {
        Write-Host "Chromium 安装成功"
    } else {
        Write-Host "Chromium 未找到，尝试重新安装"
        playwright install chromium --force
    }
  displayName: '安装 Playwright 浏览器'

# 设置环境变量并运行登录测试
- powershell: |
    $env:PLAYWRIGHT_BROWSERS_PATH = "$env:USERPROFILE\ms-playwright"
    $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"
    
    # 运行测试
    dotnet test --configuration Release --filter "LoginTest" --logger "console;verbosity=detailed"
  displayName: '运行登录测试（调试）'
  continueOnError: true

# 设置环境变量并运行所有测试
- powershell: |
    $env:PLAYWRIGHT_BROWSERS_PATH = "$env:USERPROFILE\ms-playwright"
    $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"
    
    dotnet test --configuration Release --logger "trx" --results-directory $(Build.ArtifactStagingDirectory)/TestResults
  displayName: '运行所有 UI 测试'
  continueOnError: true

# 发布测试结果
- task: PublishTestResults@2
  displayName: '发布测试结果'
  condition: always()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: false