# UI 自动化测试 Pipeline (调试版本) - 无 filter 版本
trigger:
- main

pool:
  name: 'CRR' 

steps:
- task: UseDotNet@2
  displayName: '安装 .NET 8.0'
  inputs:
    version: '8.x'

- script: dotnet restore
  displayName: '还原 NuGet 包'

- script: dotnet build --configuration Release --no-restore
  displayName: '构建项目'

- powershell: |
    $browserPath = "$env:USERPROFILE\ms-playwright"
    $browserExists = Test-Path "$browserPath\chromium-*\chrome-win\chrome.exe"
    
    if (-not $browserExists) {
        Write-Host "安装 Playwright 浏览器..." -ForegroundColor Cyan
        dotnet tool update --global Microsoft.Playwright.CLI
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        playwright install chromium
    } else {
        Write-Host "使用已安装的 Playwright 浏览器" -ForegroundColor Green
    }
    
    Write-Host "##vso[task.setvariable variable=PLAYWRIGHT_BROWSERS_PATH]$browserPath"
    Write-Host "##vso[task.setvariable variable=PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD]1"
  displayName: 'Playwright 环境准备'

# 运行所有测试（已去掉 filter）
- powershell: |
    $env:PLAYWRIGHT_BROWSERS_PATH = "$env:USERPROFILE\ms-playwright"
    $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
    
    # 确保输出目录存在
    New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/TestResults" | Out-Null
    
    Write-Host "运行所有测试..." -ForegroundColor Cyan
    
    dotnet test --configuration Release `
      --logger "trx;LogFileName=test_results.trx" `
      --logger "console;verbosity=detailed" `
      --results-directory "$(Build.ArtifactStagingDirectory)/TestResults"
  displayName: '运行所有测试'
  continueOnError: true

- task: PublishTestResults@2
  displayName: '发布测试结果'
  condition: always()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(Build.ArtifactStagingDirectory)'
    failTaskOnFailedTests: false